[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northflow"
version = "0.1.0"
description = "A mindfulness/gratitude check-in app"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Adam LaCasse"}
]

dependencies = [
    "Flask>=3.0.0",
    "Flask-Limiter>=3.5.0",
    "Flask-WTF>=1.1.0",
    "marshmallow>=3.20.0",
    "mysql-connector-python>=8.0.14",
    "python-dotenv>=1.0.0",
    "invoke>=2.2.0",
    "authlib>=1.3.0",
    "requests>=2.31.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "sqlfluff>=3.0.0",
    "click>=8.0.0",
    "djlint>=1.34.0",
    "pytest>=7.0.0",
    "pymarkdownlnt>=0.9.23",
]

test = [
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = ["app", "app.dal", "app.database", "app.routes", "app.services"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = []
