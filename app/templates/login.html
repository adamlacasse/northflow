{% extends "base.html" %}
{% block title %}Connect to Database{% endblock %}
{% block content %}
    <section class="card">
        <h2>Connect to Database</h2>
        <p>Enter database credentials to manage questions.</p>
        <form method="post" class="form-grid">
            <label>
                Host
                <input type="text" name="db_host" value="{{ config.DB_HOST }}" required>
            </label>
            <label>
                Port
                <input type="number" name="db_port" value="3306" min="1" max="65535">
            </label>
            <label>
                User
                <input type="text" name="db_user" value="{{ config.DB_USER }}" required>
            </label>
            <label>
                Password
                <input type="password" name="db_password" placeholder="Enter password">
            </label>
            <div class="form-actions">
                <button type="submit" class="btn primary">Connect</button>
            </div>
        </form>
    </section>
{% endblock %}
